version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: hat_postgres
    restart: always
    environment:
      POSTGRES_DB: hat_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hat_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql+psycopg://postgres:postgrespassword@postgres:5432/hat_app
      - SECRET_KEY=super-secret-production-key-change-in-env-file
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
