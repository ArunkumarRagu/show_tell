version: '3.8'

# ── Production Overrides ──
services:
  postgres:
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hat_app_prod}
      POSTGRES_USER: ${POSTGRES_USER:-prod_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prodpassword}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data

  api:
    build:
      context: ../api
      target: prod
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../.env.prod
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  web_app:
    build:
      context: ../web_app
      target: prod
      args:
        - VITE_API_URL=/api/v1
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    env_file:
      - ../.env.prod
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

volumes:
  postgres_prod_data:
