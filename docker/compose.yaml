version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    restart: unless-stopped

  web_app:
    restart: unless-stopped
    depends_on:
      - api
